[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-oms-lab"
version = "1.0.0"
description = "A small FastAPI and SQLite order management simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
backtest = [
    "numpy==2.5.1", "pandas==3.0.5", "scipy==1.18.0",
    "truststore==0.10.4", "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
include = ["oms*", "test*"]
